name: iOS build check

on:
  push:
    branches:
      - claude/app-build-jpvszj
    paths:
      - 'the-disconnect/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: the-disconnect/ios
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project TheDisconnect.xcodeproj \
            -scheme TheDisconnect \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and capture a screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries[]
            | select(.key | contains("iOS"))
            | .value[]
            | select(.name | contains("iPhone"))
            | .udid
          ' | head -1)
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.thedisconnect.app

          sleep 5
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/home.png

      - name: Commit screenshot to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/home.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "ci: update app screenshot [skip ci]"
            git push origin HEAD:claude/app-build-jpvszj
          fi
